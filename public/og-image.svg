<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Grid -->
    <pattern id="ogGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161824" stroke-width="1.2"/>
    </pattern>
    <radialGradient id="yellowGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fcee0a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#ff003c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="630" fill="#060608"/>
  <rect width="1200" height="630" fill="url(#ogGrid)"/>
  <rect width="1200" height="630" fill="url(#yellowGlow)"/>
  <rect width="1200" height="630" fill="url(#redGlow)"/>

  <!-- Chamfered Outer Border Frame -->
  <polygon points="30,30 1150,30 1170,50 1170,600 50,600 30,580" fill="none" stroke="#222536" stroke-width="2"/>
  
  <!-- Neon Corner Accents -->
  <polyline points="30,80 30,30 80,30" fill="none" stroke="#fcee0a" stroke-width="4"/>
  <polyline points="1120,30 1170,30 1170,80" fill="none" stroke="#ff003c" stroke-width="4"/>
  <polyline points="1170,550 1170,600 1120,600" fill="none" stroke="#fcee0a" stroke-width="4"/>
  <polyline points="80,600 30,600 30,550" fill="none" stroke="#ff003c" stroke-width="4"/>

  <!-- Top Telemetry Status Header -->
  <g transform="translate(60, 70)" font-family="monospace">
    <rect width="160" height="32" fill="#13141c" stroke="#2a2e42" rx="3"/>
    <circle cx="16" cy="16" r="4" fill="#00e676"/>
    <text x="30" y="21" fill="#f5f6fa" font-size="12" font-weight="bold">AVAILABLE FOR HIRE</text>

    <rect x="180" width="220" height="32" fill="#13141c" stroke="#fcee0a" stroke-opacity="0.4" rx="3"/>
    <text x="195" y="21" fill="#fcee0a" font-size="12" font-weight="bold">B.TECH CSE &apos;27 // FINAL YEAR</text>

    <text x="1050" y="21" text-anchor="end" fill="#8a8f9d" font-size="12">PORTFOLIO // DR-GHOST7</text>
  </g>

  <!-- Main Headline Block -->
  <g transform="translate(60, 160)">
    <text x="0" y="50" fill="#8a8f9d" font-family="monospace" font-size="20" font-weight="bold" letter-spacing="4">HELLO, I AM</text>
    
    <text x="0" y="145" fill="#f5f6fa" font-family="sans-serif" font-size="82" font-weight="900" letter-spacing="-2">
      SINJINI <tspan fill="#fcee0a">GHOSH</tspan><tspan fill="#ff003c">.</tspan>
    </text>
    
    <text x="0" y="205" fill="#d1d5db" font-family="monospace" font-size="24" font-weight="bold" letter-spacing="2">
      FRONTEND DEVELOPER <tspan fill="#ff003c">//</tspan> VISUAL DESIGNER
    </text>

    <!-- Bio Sub-quote -->
    <text x="0" y="250" fill="#8a8f9d" font-family="sans-serif" font-size="16">
      Building reactive web apps &amp; behavioral dynamic interfaces in React &amp; Next.js.
    </text>
    <text x="0" y="275" fill="#8a8f9d" font-family="sans-serif" font-size="16">
      Published Godot game on itch.io • Visual designs in Canva &amp; Ibis Paint X.
    </text>
  </g>

  <!-- Right Visual Deck / Telemetry Box -->
  <g transform="translate(780, 170)">
    <rect width="330" height="260" fill="#0d0e14" stroke="#25293d" stroke-width="1.5" rx="6"/>
    <rect width="330" height="38" fill="#131520" rx="6"/>
    <text x="20" y="24" fill="#fcee0a" font-family="monospace" font-size="12" font-weight="bold">CORE ARTIFACTS</text>
    <circle cx="310" cy="19" r="4" fill="#ff003c"/>

    <!-- Mini Cards list -->
    <g transform="translate(20, 55)" font-family="monospace" font-size="12">
      <!-- Item 1 -->
      <rect width="290" height="38" fill="#141724" stroke="#202438" rx="3"/>
      <text x="12" y="24" fill="#ffffff" font-weight="bold">◈ TypeLock</text>
      <text x="278" y="24" text-anchor="end" fill="#3ee08a" font-size="10">Biometrics</text>

      <!-- Item 2 -->
      <rect y="48" width="290" height="38" fill="#141724" stroke="#202438" rx="3"/>
      <text x="12" y="72" fill="#ffffff" font-weight="bold">◈ Flag Memory</text>
      <text x="278" y="72" text-anchor="end" fill="#fcee0a" font-size="10">Leitner App</text>

      <!-- Item 3 -->
      <rect y="96" width="290" height="38" fill="#141724" stroke="#202438" rx="3"/>
      <text x="12" y="120" fill="#ffffff" font-weight="bold">◈ A* vs Q-Learning</text>
      <text x="278" y="120" text-anchor="end" fill="#ff003c" font-size="10">AI Simulation</text>

      <!-- Item 4 -->
      <rect y="144" width="290" height="38" fill="#141724" stroke="#202438" rx="3"/>
      <text x="12" y="168" fill="#ffffff" font-weight="bold">◈ Gangling Bro&apos;s</text>
      <text x="278" y="168" text-anchor="end" fill="#fa5c5c" font-size="10">itch.io Game</text>
    </g>
  </g>

  <!-- Skill Badges Strip (Bottom Left) -->
  <g transform="translate(60, 475)" font-family="monospace" font-size="12" font-weight="bold">
    <g transform="translate(0, 0)">
      <rect width="90" height="28" fill="#13141c" stroke="#fcee0a" stroke-opacity="0.6" rx="2"/>
      <text x="45" y="18" fill="#fcee0a" text-anchor="middle">React.js</text>
    </g>
    <g transform="translate(100, 0)">
      <rect width="90" height="28" fill="#13141c" stroke="#fcee0a" stroke-opacity="0.6" rx="2"/>
      <text x="45" y="18" fill="#fcee0a" text-anchor="middle">Next.js</text>
    </g>
    <g transform="translate(200, 0)">
      <rect width="110" height="28" fill="#13141c" stroke="#2a2e42" rx="2"/>
      <text x="55" y="18" fill="#ffffff" text-anchor="middle">JavaScript</text>
    </g>
    <g transform="translate(320, 0)">
      <rect width="70" height="28" fill="#13141c" stroke="#ff003c" stroke-opacity="0.6" rx="2"/>
      <text x="35" y="18" fill="#ff003c" text-anchor="middle">Canva</text>
    </g>
    <g transform="translate(400, 0)">
      <rect width="105" height="28" fill="#13141c" stroke="#ff003c" stroke-opacity="0.6" rx="2"/>
      <text x="52" y="18" fill="#ff003c" text-anchor="middle">Ibis Paint X</text>
    </g>
    <g transform="translate(515, 0)">
      <rect width="115" height="28" fill="#13141c" stroke="#00e676" stroke-opacity="0.6" rx="2"/>
      <text x="57" y="18" fill="#00e676" text-anchor="middle">Godot Engine</text>
    </g>
  </g>

  <!-- Bottom Coordinates Footer -->
  <g transform="translate(60, 570)" font-family="monospace" font-size="12" fill="#8a8f9d">
    <text x="0">GITHUB: github.com/Dr-Ghost7</text>
    <text x="440">ITCH.IO: missstaticmoth.itch.io</text>
    <text x="820">EMAIL: sguse001@gmail.com</text>
  </g>
</svg>
