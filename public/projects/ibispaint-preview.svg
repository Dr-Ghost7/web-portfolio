<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0c0b12"/>
  <rect x="30" y="25" width="740" height="400" fill="#13121d" stroke="#262338" stroke-width="1" rx="6"/>
  <rect x="30" y="25" width="740" height="50" fill="#1a1929" rx="6"/>
  <text x="55" y="57" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">DIGITAL ART &amp; GAME CONCEPTS</text>
  <text x="745" y="57" text-anchor="end" fill="#ff3b69" font-family="monospace" font-size="12" font-weight="bold">TOOL: IBIS PAINT X</text>

  <!-- Canvas Painting Interface -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="460" height="300" fill="#0a0910" stroke="#2a263d" rx="4"/>
    <circle cx="230" cy="110" r="50" fill="#ff3b69" opacity="0.75"/>
    <path d="M 120 280 C 150 190, 180 140, 230 120 C 280 140, 310 190, 340 280 Z" fill="#221833"/>
    <text x="230" y="270" fill="#e0d8f0" text-anchor="middle" font-family="monospace" font-size="12">DIGITAL ILLUSTRATION &amp; GAME ASSETS</text>

    <!-- Right info -->
    <rect x="480" y="0" width="200" height="300" fill="#171624" stroke="#2a263d" rx="4"/>
    <text x="500" y="35" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">CREATIVE WORKFLOW</text>
    
    <g transform="translate(500, 60)" font-family="monospace" font-size="11" fill="#d1d5db">
      <text y="20">• App: Ibis Paint X</text>
      <text y="50">• Focus: Character art,</text>
      <text y="70">  game textures, concepts</text>
      <text y="100">• Palette: High-contrast</text>
      <text y="120">• Medium: Digital brushwork</text>
    </g>

    <rect x="500" y="225" width="160" height="35" fill="#ff3b69" rx="3"/>
    <text x="580" y="247" fill="#ffffff" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold">ARTWORK GALLERY</text>
  </g>
</svg>
